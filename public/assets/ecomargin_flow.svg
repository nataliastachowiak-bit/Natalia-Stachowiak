<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A09" />
      <stop offset="100%" stop-color="#0B130F" />
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#flowBg)" />
  <rect x="20" y="20" width="1160" height="320" rx="14" fill="none" stroke="#C7A35A" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Continuous Flow Line -->
  <line x1="100" y1="170" x2="1100" y2="170" stroke="#C7A35A" stroke-opacity="0.35" stroke-width="2" />

  <!-- 6 Step Cards -->
  <!-- 01 DETECT -->
  <g transform="translate(100, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#10B981" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#10B981">01</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">DETECT</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">Where am I losing</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">money or resources?</text>
  </g>

  <!-- 02 UNDERSTAND -->
  <g transform="translate(300, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#C7A35A" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#C7A35A">02</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#C7A35A" letter-spacing="1">UNDERSTAND</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">What might be</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">causing the leak?</text>
  </g>

  <!-- 03 SIMULATE -->
  <g transform="translate(500, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#10B981" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#10B981">03</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">SIMULATE</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">What happens if</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">I change something?</text>
  </g>

  <!-- 04 EXPERIMENT -->
  <g transform="translate(700, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#C7A35A" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#C7A35A">04</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#C7A35A" letter-spacing="1">EXPERIMENT</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">How can I test</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">the change safely?</text>
  </g>

  <!-- 05 MEASURE -->
  <g transform="translate(900, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#10B981" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#10B981">05</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">MEASURE</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">Did it work?</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">Before vs After</text>
  </g>

  <!-- 06 LEARN -->
  <g transform="translate(1100, 170)">
    <circle cx="0" cy="0" r="28" fill="#101412" stroke="#C7A35A" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="13" font-weight="700" fill="#C7A35A">06</text>
    <text x="0" y="-45" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#C7A35A" letter-spacing="1">LEARN</text>
    <text x="0" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#D1D5DB">Keep, adjust</text>
    <text x="0" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9CA3AF">or stop action?</text>
  </g>
</svg>
