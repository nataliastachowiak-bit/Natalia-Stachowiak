name: External Project Apps Audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-apps:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Playwright browser tooling
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Check external prototype links in desktop and mobile Chromium
        run: node scripts/external-project-apps-audit.mjs
      - name: Save external app audit and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-project-apps-audit
          path: qa-artifacts/
          retention-days: 7
