name: Validate Portfolio Pull Request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare certificate availability
        run: python3 scripts/prepare_certificates.py
      - name: Validate types
        run: npm run lint
      - name: Compile GitHub Pages build
        run: npm run build:gh
      - name: Validate built assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root = Path("dist")
          required = [
              "index.html",
              "404.html",
              "assets/Natalia_Stachowiak_CV.pdf",
              "assets/resourceloop_ai.png",
              "images/natalia-business-portrait.png",
              "assets/certificates/Professional-Scrum-Master-I.pdf",
              "assets/certificates/Professional-Scrum-Product-Owner-I.pdf",
              "assets/certificates/google-cloud-depsapgc1x-edx.pdf"
          ]
          failures = [p for p in required if not (root / p).is_file() or (root / p).stat().st_size == 0]
          if failures:
              print("Missing or empty published assets:", failures, file=sys.stderr)
              sys.exit(1)
          print("Required portfolio assets and CV PDF exist in dist.")
          PY
